<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>WashCRM 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a}header{padding:calc(18px + env(safe-area-inset-top)) 16px 16px;background:#0f172a;color:#fff}.wrap{max-width:760px;margin:auto;padding:14px 14px 95px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:0 2px 14px #0000000c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi b{display:block;font-size:23px}.muted,.kpi span,label{font-size:12px;color:#64748b}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 13px;background:#0f172a;color:#fff;font-weight:700}button.light{background:#e2e8f0;color:#0f172a}button.red{background:#fee2e2;color:#991b1b}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;margin:5px 0;background:#fff;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}h2{font-size:18px}.hide{display:none!important}.login{max-width:430px;margin:45px auto}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.jobtop{display:flex;justify-content:space-between;gap:8px}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#e2e8f0;font-size:11px;margin-top:6px}.actions{display:flex;gap:6px;margin-top:9px}.actions button{flex:1;font-size:12px;padding:9px}.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:27px;box-shadow:0 8px 25px #0004}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.sheet{width:100%;max-height:92vh;overflow:auto;background:#f8fafc;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.svc{display:flex;gap:8px;align-items:center;padding:10px;background:#fff;border-radius:11px;margin:5px 0}.svc input{width:20px;margin:0}.svc span{flex:1}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px}.wash{border-left:4px solid #0f172a}.adminRow{display:flex;justify-content:space-between;gap:10px;align-items:center}.adminRow button{white-space:nowrap}.empty{text-align:center;color:#64748b;padding:22px}
</style></head><body>
<header><div class="topline"><div><b style="font-size:22px">💦 WashCRM</b><div class="small" id="sub">Коммерческая версия 2.0</div></div><button id="logout" class="light hide" onclick="logout()">Выйти</button></div></header>
<div class="wrap">
<section id="login" class="login card"><h2>Вход</h2><label>Логин</label><input id="loginName" placeholder="admin или demo"><label>Пароль</label><input id="loginPass" type="password" placeholder="Пароль"><button style="width:100%;margin-top:7px" onclick="doLogin()">Войти</button><p class="muted">Демо: demo / 1234<br>Главный администратор: admin / admin</p></section>

<section id="owner" class="hide">
<div class="topline"><div><h2 id="washName" style="margin:4px 0">Автомойка</h2><div class="muted">Панель владельца / сотрудника</div></div><span class="pill" id="rolePill"></span></div>
<div class="grid" style="margin:12px 0"><div class="card kpi"><b id="cars">0</b><span>машин сегодня</span></div><div class="card kpi"><b id="dayRev">0 ₽</b><span>сегодня оплачено</span></div><div class="card kpi"><b id="monthRev">0 ₽</b><span>за месяц</span></div><div class="card kpi"><b id="avg">0 ₽</b><span>средний чек</span></div></div>
<div class="tabs"><button onclick="setFilter('today')">Сегодня</button><button class="light" onclick="setFilter('all')">Все записи</button></div>
<div id="jobs"></div><button class="fab" onclick="openJob()">+</button>
</section>

<section id="admin" class="hide"><h2>Главный администратор</h2><div class="grid"><div class="card kpi"><b id="washCount">0</b><span>автомоек</span></div><div class="card kpi"><b id="activeCount">0</b><span>активных</span></div></div>
<div class="card"><h2>Добавить автомойку</h2><input id="newWash" placeholder="Название автомойки"><div class="row"><input id="newLogin" placeholder="Логин"><input id="newPass" placeholder="Пароль"></div><button onclick="addWash()">Создать</button></div><div id="washes"></div></section>
</div>

<div class="modal" id="jobModal" onclick="if(event.target===this)closeJob()"><div class="sheet"><h2>Новая запись</h2>
<div class="row"><div><label>Дата</label><input id="date" type="date"></div><div><label>Время</label><input id="time" type="time"></div></div>
<input id="client" placeholder="Имя клиента"><input id="phone" type="tel" placeholder="Телефон">
<div class="row"><input id="car" placeholder="Автомобиль"><input id="plate" placeholder="Госномер"></div>
<label>Услуги</label><div id="services"></div><h2 style="text-align:right">Итого: <span id="total">0</span> ₽</h2>
<div class="row"><button class="light" onclick="closeJob()">Отмена</button><button onclick="saveJob()">Сохранить</button></div></div></div>
<script>
const S=[["Кузов",700],["Кузов + салон",1200],["Пылесос",400],["Чернение шин",250],["Воск",350],["Химчистка",3500]];
const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat("ru-RU").format(n)+" ₽";
const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let db=JSON.parse(localStorage.getItem("washcrm2")||"null")||{washes:[{id:"demo",name:"Демо Автомойка",login:"demo",pass:"1234",active:true}],jobs:[]};
let session=null,filter="today";
function save(){localStorage.setItem("washcrm2",JSON.stringify(db))}
function doLogin(){let l=$("loginName").value.trim(),p=$("loginPass").value;if(l==="admin"&&p==="admin"){session={role:"admin"};showAdmin();return}let w=db.washes.find(x=>x.login===l&&x.pass===p);if(!w)return alert("Неверный логин или пароль");if(!w.active)return alert("Доступ к автомойке приостановлен владельцем сервиса");session={role:"owner",washId:w.id};showOwner()}
function base(){["login","owner","admin"].forEach(x=>$(x).classList.add("hide"));$("logout").classList.remove("hide")}
function logout(){session=null;["owner","admin"].forEach(x=>$(x).classList.add("hide"));$("login").classList.remove("hide");$("logout").classList.add("hide");$("sub").textContent="Коммерческая версия 2.0"}
function showAdmin(){base();$("admin").classList.remove("hide");$("sub").textContent="Главный администратор";renderAdmin()}
function renderAdmin(){$("washCount").textContent=db.washes.length;$("activeCount").textContent=db.washes.filter(x=>x.active).length;$("washes").innerHTML=db.washes.map(w=>`<div class="card wash"><div class="adminRow"><div><b>${w.name}</b><div class="muted">Логин: ${w.login} · ${w.active?"Доступ активен":"Заблокирована"}</div></div><button class="${w.active?"red":"light"}" onclick="toggleWash('${w.id}')">${w.active?"Блокировать":"Включить"}</button></div></div>`).join("")}
function addWash(){let name=$("newWash").value.trim(),login=$("newLogin").value.trim(),pass=$("newPass").value.trim();if(!name||!login||!pass)return alert("Заполните название, логин и пароль");if(db.washes.some(x=>x.login===login))return alert("Такой логин уже существует");db.washes.push({id:"w"+Date.now(),name,login,pass,active:true});save();["newWash","newLogin","newPass"].forEach(x=>$(x).value="");renderAdmin()}
function toggleWash(id){let w=db.washes.find(x=>x.id===id);w.active=!w.active;save();renderAdmin()}
function showOwner(){base();$("owner").classList.remove("hide");let w=db.washes.find(x=>x.id===session.washId);$("washName").textContent=w.name;$("sub").textContent=w.name;$("rolePill").textContent="Владелец";renderJobs()}
function setFilter(x){filter=x;renderJobs()}
function renderJobs(){let all=db.jobs.filter(x=>x.washId===session.washId),t=today(),m=t.slice(0,7),paid=all.filter(x=>x.paid),shown=filter==="today"?all.filter(x=>x.date===t):all;$("cars").textContent=all.filter(x=>x.date===t).length;$("dayRev").textContent=money(paid.filter(x=>x.date===t).reduce((a,x)=>a+x.price,0));$("monthRev").textContent=money(paid.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.price,0));$("avg").textContent=money(paid.length?Math.round(paid.reduce((a,x)=>a+x.price,0)/paid.length):0);$("jobs").innerHTML=shown.length?shown.map(j=>`<div class="card"><div class="jobtop"><div><b>${j.time} · ${j.client}</b><div class="muted">${j.date} · ${j.car||"Авто"} ${j.plate?"· "+j.plate:""}</div></div><b>${money(j.price)}</b></div><div class="muted" style="margin-top:6px">${j.services.join(" · ")}</div><span class="pill">${j.status}</span><div class="actions">${j.status!=="Оплачен"?`<button onclick="nextStatus(${j.id})">Следующий статус</button>`:""}<button class="red" onclick="delJob(${j.id})">Удалить</button></div></div>`).join(""):`<div class="card empty">Записей пока нет</div>`}
function openJob(){$("jobModal").style.display="flex";$("date").value=today();$("time").value=new Date().toTimeString().slice(0,5);["client","phone","car","plate"].forEach(x=>$(x).value="");document.querySelectorAll("#services input").forEach(x=>x.checked=false);calc()}
function closeJob(){$("jobModal").style.display="none"}
function calc(){let n=0;document.querySelectorAll("#services input:checked").forEach(x=>n+=S[+x.dataset.i][1]);$("total").textContent=n}
function saveJob(){let sel=[...document.querySelectorAll("#services input:checked")].map(x=>S[+x.dataset.i]);if(!$("client").value.trim()||!sel.length)return alert("Укажите клиента и услугу");db.jobs.unshift({id:Date.now(),washId:session.washId,date:$("date").value,time:$("time").value,client:$("client").value.trim(),phone:$("phone").value.trim(),car:$("car").value.trim(),plate:$("plate").value.trim(),services:sel.map(x=>x[0]),price:sel.reduce((a,x)=>a+x[1],0),status:"Записан",paid:false});save();closeJob();renderJobs()}
function nextStatus(id){let j=db.jobs.find(x=>x.id===id&&x.washId===session.washId),a=["Записан","В работе","Готов","Оплачен"],i=a.indexOf(j.status);j.status=a[Math.min(i+1,3)];j.paid=j.status==="Оплачен";save();renderJobs()}
function delJob(id){if(confirm("Удалить запись?")){db.jobs=db.jobs.filter(x=>x.id!==id);save();renderJobs()}}
$("services").innerHTML=S.map((x,i)=>`<label class="svc"><input type="checkbox" data-i="${i}" onchange="calc()"><span>${x[0]}</span><b>${money(x[1])}</b></label>`).join("");
save();
</script></body></html>
